name: Android 检查

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleDebug assembleRelease

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            for test in \
              com.sky22333.skyadb.ai.AiClientIntegrationTest \
              com.sky22333.skyadb.ai.AiResponsesIntegrationTest \
              com.sky22333.skyadb.ai.AiApprovalIntegrationTest \
              com.sky22333.skyadb.ai.AiDownloadIntegrationTest \
              com.sky22333.skyadb.ai.AiDownloadFlowTest \
              com.sky22333.skyadb.ai.AgentToolsIntegrationTest \
              com.sky22333.skyadb.ai.LocalCacheAuditTest \
              com.sky22333.skyadb.ai.AiConfigSaveTest \
              com.sky22333.skyadb.ai.AiDraftIntegrationTest \
              com.sky22333.skyadb.ai.AiInterruptedStreamTest \
              com.sky22333.skyadb.ai.AiNavigationUiTest \
              com.sky22333.skyadb.ai.AiMarkdownUiTest \
              com.sky22333.skyadb.ui.CompactActionsUiTest \
              com.sky22333.skyadb.ui.apps.AppActionMenuUiTest \
              com.sky22333.skyadb.ui.apps.AppsFilterUiTest \
              com.sky22333.skyadb.ui.files.FileActionsUiTest \
              com.sky22333.skyadb.ui.logs.SystemLogUiTest \
              com.sky22333.skyadb.ui.remote.RemoteControlUiTest; do
              ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class="$test"
            done
            adb reverse tcp:15555 tcp:5555
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.sky22333.skyadb.ai.AiDeviceIntegrationTest -Pandroid.testInstrumentationRunnerArguments.adbPort=15555
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class='com.sky22333.skyadb.ai.AgentToolsIntegrationTest#connectionsAreReused,com.sky22333.skyadb.ai.AiDeviceFileAuditTest#legacyShellReportsExitCode,com.sky22333.skyadb.ai.AiDeviceFileAuditTest#shellRetainsExitCodeAfterLargeOutput' -Pandroid.testInstrumentationRunnerArguments.targetHost=127.0.0.1 -Pandroid.testInstrumentationRunnerArguments.targetPort=15555
            adb reverse --remove tcp:15555
